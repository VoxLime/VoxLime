

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>VoxLime Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #090b12;
      color: #f5f7fa;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      padding: 35px;
      background: #131722;
      border: 1px solid #252d3c;
      border-radius: 18px;
      box-shadow: 0 20px 60px #0008;
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: 32px;
      color: #a3e635;
      letter-spacing: -1px;
    }

    .brand p {
      color: #929bad;
      margin-top: 9px;
      font-size: 13px;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 13px;
      color: #cbd5e1;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #30394a;
      border-radius: 9px;
      background: #0b0f18;
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #a3e635;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #a3e635;
      color: #111827;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
      text-align: center;
      color: #fb7185;
    }

    .footer {
      text-align: center;
      color: #687386;
      margin-top: 25px;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="brand">
      <h1>VoxLime</h1>
      <p>ADMIN CONTROL PANEL</p>
    </div>

    <form id="loginForm">
      <label for="username">Admin Username</label>
      <input
        id="username"
        name="username"
        type="text"
        maxlength="100"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        minlength="16"
        maxlength="256"
        autocomplete="current-password"
        required
      >

      <button id="loginButton" type="submit">
        Sign In
      </button>

      <div id="message" role="status"></div>
    </form>

    <div class="footer">
      Secure Admin Access · VoxLime
    </div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const button = document.getElementById("loginButton");
    const message = document.getElementById("message");

    async function checkSession() {
      try {
        const response = await fetch("/api/admin/me", {
          credentials: "same-origin",
          cache: "no-store"
        });

        const data = await response.json();

        if (response.ok && data.authenticated) {
          window.location.replace("/admin-dashboard.html");
        }
      } catch (error) {
        console.error("Session check failed:", error);
      }
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      button.disabled = true;
      button.textContent = "Signing in...";
      message.textContent = "";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "same-origin",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          message.textContent =
            data.message || "Login failed. Check your credentials.";
          return;
        }

        window.location.replace("/admin-dashboard.html");

      } catch (error) {
        message.textContent =
          "Unable to connect. Please try again.";
        console.error("Login error:", error);

      } finally {
        button.disabled = false;
        button.textContent = "Sign In";
      }
    });

    checkSession();
  </script>
</body>
</html>
